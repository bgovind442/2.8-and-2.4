<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCEA Rank Score Calculator</title>
  <link rel="stylesheet" href="rankscore.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="main-wrapper">
    <main class="calculator-container" role="main">
      <h1>NCEA Rank Score Calculator</h1>
      <div class="grid-header open-sans" aria-hidden="true">
        <div>Subject</div>
        <div>Excellence</div>
        <div>Merit</div>
        <div>Achieved</div>
        <div>Total</div>
      </div>

      <!-- 6 Subject Rows -->
      <div class="subject-row">
        <select class="subject-name"><option value="">Select Subject</option></select>
        <input type="number" class="excellence" placeholder="E" value="0" min="0"/>
        <input type="number" class="merit" placeholder="M" value="0" min="0"/>
        <input type="number" class="achieved" placeholder="A" value="0" min="0"/>
        <div class="total">0</div>
      </div>
      <div class="subject-row">
        <select class="subject-name"><option value="">Select Subject</option></select>
        <input type="number" class="excellence" placeholder="E" value="0" min="0"/>
        <input type="number" class="merit" placeholder="M" value="0" min="0"/>
        <input type="number" class="achieved" placeholder="A" value="0" min="0"/>
        <div class="total">0</div>
      </div>
      <div class="subject-row">
        <select class="subject-name"><option value="">Select Subject</option></select>
        <input type="number" class="excellence" placeholder="E" value="0" min="0"/>
        <input type="number" class="merit" placeholder="M" value="0" min="0"/>
        <input type="number" class="achieved" placeholder="A" value="0" min="0"/>
        <div class="total">0</div>
      </div>
      <div class="subject-row">
        <select class="subject-name"><option value="">Select Subject</option></select>
        <input type="number" class="excellence" placeholder="E" value="0" min="0"/>
        <input type="number" class="merit" placeholder="M" value="0" min="0"/>
        <input type="number" class="achieved" placeholder="A" value="0" min="0"/>
        <div class="total">0</div>
      </div>
      <div class="subject-row">
        <select class="subject-name"><option value="">Select Subject</option></select>
        <input type="number" class="excellence" placeholder="E" value="0" min="0"/>
        <input type="number" class="merit" placeholder="M" value="0" min="0"/>
        <input type="number" class="achieved" placeholder="A" value="0" min="0"/>
        <div class="total">0</div>
      </div>
      <div class="subject-row">
        <select class="subject-name"><option value="">Select Subject</option></select>
        <input type="number" class="excellence" placeholder="E" value="0" min="0"/>
        <input type="number" class="merit" placeholder="M" value="0" min="0"/>
        <input type="number" class="achieved" placeholder="A" value="0" min="0"/>
        <div class="total">0</div>
      </div>

    
    </main>

    <aside class="totals-sidebar">
      <div class="totals-section">
        <h3>Subtotal (Total Credits)</h3>
        E: <span id="subtotal-e">0</span> | M: <span id="subtotal-m">0</span> | A: <span id="subtotal-a">0</span> | Total: <span id="subtotal-total">0</span>
        <h3>Best 80 Credits</h3>
        E: <span id="best-e">0</span> | M: <span id="best-m">0</span> | A: <span id="best-a">0</span> | Total: <span id="best-total">0</span>
        <h3>Points Calculated</h3>
        E Points: <span id="calc-e">0</span> | M Points: <span id="calc-m">0</span> | A Points: <span id="calc-a">0</span> | Total Rank Score: <span id="calc-total">0</span>
      </div>
      <div class="final-score">
        Final Rank Score: <span id="rank-score">0</span>
      </div>
    </aside>
  </div>

  <script src="rankscore.js"></script>
</body>
</html>
